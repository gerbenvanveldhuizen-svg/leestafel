name: Bronnen testen (tijdelijk)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Feeds en artikelpagina's proberen vanaf GitHub
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36"
          for u in https://feeds.nos.nl/nosnieuwsalgemeen https://www.nd.nl/rss https://fd.nl/?rss https://www.trouw.nl/rss.xml https://www.ewmagazine.nl/feed/ https://www.cvandaag.nl/rss https://www.bnr.nl/?rss; do
            code=$(curl -s -A "$UA" -L --compressed --max-time 20 -o /tmp/f.xml -w "%{http_code}" "$u")
            link=$(grep -oE '<item>.*?</item>|<item>' /tmp/f.xml >/dev/null; python3 -c "import re,sys;t=open('/tmp/f.xml',errors='ignore').read();m=re.search(r'<item>.*?<link>(?:<!\[CDATA\[)?([^<\]]+)',t,re.S);print(m.group(1) if m else '')")
            acode=""; [ -n "$link" ] && acode=$(curl -s -A "$UA" -L --compressed --max-time 20 -o /dev/null -w "%{http_code}" "$link")
            echo "BRONTEST $u feed=$code artikel=$acode"
          done
